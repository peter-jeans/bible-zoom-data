name: Build and publish data

on:
  push:
    branches: [main]
  schedule:
    # Daily pre-population run (03:00 UTC). Each day's budget grows by
    # queue/config.json chapters_per_day, in queue order (spec v0.5 §8.3).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Build every chapter now (ignore the daily budget)"
        type: boolean
        default: false
      focus:
        description: "Focus books first, e.g. GEN or GEN,EXO (blank = queue/config.json)"
        type: string
        default: ""
      layers:
        description: "Note for the run log: layers the admin asked to refresh (all engines always run)"
        type: string
        default: ""

permissions:
  contents: write # v0.23: commit the app's AI export (ai/export) to this repository only
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Week stamp (refresh open sources weekly)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-v1-${{ hashFiles('scripts/fetch-sources.mjs') }}-${{ steps.week.outputs.week }}
      - name: Copy saved AI suggestions from the app (spec v0.23)
        run: |
          node scripts/fetch-ai-export.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d ai/export ]; then git add -A ai/export; fi
          if git diff --cached --quiet; then echo "AI export unchanged"; else git commit -q -m "AI export: saved suggestions from the app" && (git push -q || echo "::warning title=AI export::Push failed; the next run will retry"); fi
      - name: Fetch open sources (skipped when cached)
        run: node scripts/fetch-sources.mjs
      - name: Build (scheduler)
        env:
          FOCUS_BOOKS: ${{ github.event.inputs.focus }}
        run: node scripts/build.mjs dist ${{ github.event.inputs.all == 'true' && '--all' || '' }}
      - name: Validate release (registry, licences, coverage, tags, progress)
        run: node scripts/validate.mjs dist
      - name: Summary
        run: |
          node -e '
          const p=require("./dist/progress.json");
          const lines=["### Bible Zoom data","",`Chapters built: ${p.chapters.built} / ${p.chapters.total} (budget ${p.chapters.allowed_today})`,"",
          "| Layer | Chapters |","|---|---|",...Object.entries(p.layers).filter(([,v])=>v.built).map(([k,v])=>`| ${k} | ${v.built} (${v.percent}%) |`),"",
          `Focus: ${(p.focus||[]).join(", ")||"none"}`,`Next in queue: ${p.queue.next.slice(0,10).join(", ")}`];
          require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n")+"\n");'
          echo "Size: $(du -sh dist | cut -f1), files: $(find dist -type f | wc -l) (GitHub Pages limit about 1 GB)" >> "$GITHUB_STEP_SUMMARY"
          MB=$(du -sm dist | cut -f1)
          if [ "$MB" -gt 600 ]; then echo "::warning title=Data size::The data site is ${MB} MB (warning at 600 MB; GitHub Pages limit about 1 GB). Plan to split or slim the data."; echo "⚠️ Size warning: ${MB} MB (over 600 MB)" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
